name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  LLVM_VERSION: 20

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} tools
        run: |
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg /tmp/llvm-snapshot.gpg.key
          CODENAME=$(. /etc/os-release && echo ${UBUNTU_CODENAME})
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ env.LLVM_VERSION }} main" | sudo tee /etc/apt/sources.list.d/llvm-${{ env.LLVM_VERSION }}.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.LLVM_VERSION }} clang-tidy-${{ env.LLVM_VERSION }}

      - name: Check formatting
        run: clang-format-${{ env.LLVM_VERSION }} --dry-run --Werror include/kdtree/*.hpp tools/*.cpp test/*.cpp

      - name: Configure (for compile_commands.json)
        run: cmake -B build

      - name: Run clang-tidy
        run: clang-tidy-${{ env.LLVM_VERSION }} -p build include/kdtree/*.hpp tools/*.cpp --warnings-as-errors='*'
